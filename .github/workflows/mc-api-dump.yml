name: MC API dump (temporary)

# Temporary helper: prints the signatures of a few Minecraft classes into the log.
on:
  push:
    branches: [claude/aimbot-verbesserung-3nb9ne]
    paths: ['.github/workflows/mc-api-dump.yml']

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileJava --no-daemon -q
      - name: Dump
        shell: bash {0}
        run: |
          JAR=$(ls ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-deobf/26.3/minecraft-merged-deobf-26.3.jar)
          echo "JAR=$JAR"
          LIST=$(unzip -l "$JAR" | awk '{print $4}' | grep '\.class$' | grep -v '\$')
          echo "===== classes matching camera/input/fov/freecam"; echo "$LIST" | grep -iE 'net/minecraft/client/.*(camera|input|fov|zoom|spyglass)' | head -60
          jp() { echo "===== $1"; javap -p -cp "$JAR" "$1" 2>&1 | grep -v 'lambda\$' | head -${2:-120}; }
          for p in $(echo "$LIST" | grep -iE '^net/minecraft/client/([a-z/]*/)?Camera\.class$|/KeyboardInput\.class$|/ClientInput\.class$|client/MouseHandler\.class$|client/KeyMapping\.class$|renderer/GameRenderer\.class$'); do
            n=${p%.class}; jp "${n//\//.}" 200
          done
          echo "===== Entity (turn/rot)"; javap -p -cp "$JAR" net.minecraft.world.entity.Entity | grep -iE 'turn|setYRot|setXRot|noPhysics|getViewYRot|getEyePosition'
          echo "===== LocalPlayer"; javap -p -cp "$JAR" net.minecraft.client.player.LocalPlayer | grep -iE 'input|aiStep|move|camera|tick|serverAiStep|isControlledCamera'
          echo "===== Options"; javap -p -cp "$JAR" net.minecraft.client.Options | grep -iE 'fov|sensitiv|smooth|camera|key(Up|Down|Left|Right|Jump|Shift|Sprint|Attack|Use|Togglep)'
          echo "===== Minecraft"; javap -p -cp "$JAR" net.minecraft.client.Minecraft | grep -iE 'camera|hitResult|pick|options|player\b'
          echo "===== Inventory"; javap -p -cp "$JAR" net.minecraft.world.entity.player.Inventory | grep -iE 'select|swap|scroll'
          echo "===== Fabric mouse scroll"; javap -p -cp "$JAR" net.minecraft.client.MouseHandler | grep -iE 'scroll|turn|sens'
